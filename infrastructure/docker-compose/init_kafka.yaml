version: '3.7'

services:
  init-kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.0.1}

    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "=========================================="
        echo "Waiting for all 3 Kafka brokers..."
        echo "=========================================="

        cub kafka-ready \
          -b kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092 \
          3 \
          120

        echo "=========================================="
        echo "Kafka cluster is ready"
        echo "=========================================="

        echo "Creating payment-request..."
        kafka-topics \
          --bootstrap-server kafka-broker-1:9092 \
          --create \
          --if-not-exists \
          --topic payment-request \
          --partitions 3 \
          --replication-factor 3

        echo "Creating payment-response..."
        kafka-topics \
          --bootstrap-server kafka-broker-1:9092 \
          --create \
          --if-not-exists \
          --topic payment-response \
          --partitions 3 \
          --replication-factor 3

        echo "Creating payment-approval-request..."
        kafka-topics \
          --bootstrap-server kafka-broker-1:9092 \
          --create \
          --if-not-exists \
          --topic payment-approval-request \
          --partitions 3 \
          --replication-factor 3

        echo "Creating payment-approval-response..."
        kafka-topics \
          --bootstrap-server kafka-broker-1:9092 \
          --create \
          --if-not-exists \
          --topic payment-approval-response \
          --partitions 3 \
          --replication-factor 3

        echo ""
        echo "=========================================="
        echo "Current Kafka topics"
        echo "=========================================="

        kafka-topics \
          --bootstrap-server kafka-broker-1:9092 \
          --list

        echo ""
        echo "=========================================="
        echo "Kafka initialization completed"
        echo "=========================================="

    networks:
      - food-ordering-system